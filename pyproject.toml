[tool.poetry]
name = "tent"
version = "3.0.0"
description = "TENT package"
authors = ["riley206-pnnl"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
gevent = ">=24.2.1"
SQLAlchemy = ">=2.0.0"
pandas = ">=2.0.0"
python-dateutil = ">=2.8.0"
tzlocal = ">=4.1,<5.0"
matplotlib = ">=3.7.0"
setuptools = ">=68.0.0"
numpy = ">=1.26.0"
sqlalchemy-utils = ">=0.41.3"
intervals = ">=0.9.1"
six = ">=1.16.0"
greenlet = ">=3.0.0"
bacpypes = ">=0.16.7"
wheel = ">=0.30.0"
deepdiff = ">=6.3.0"
sortedcontainers = ">=2.4.0"
uuid6 = ">=2025.0.1"
plotext = ">=5.2.8"

# Optional physical simulator backends for tent.flexibility.
# Install with: poetry install --extras flexibility
pvlib = { version = ">=0.10", optional = true }
ochre-nrel = { version = "*", optional = true }
pint = { version = "==0.24.4", optional = true }

[tool.poetry.extras]
pvlib = ["pvlib"]
ochre = ["ochre-nrel", "pint"]
flexibility = ["pvlib", "ochre-nrel", "pint"]

[tool.poetry.group.dev.dependencies]
pytest = "~7.4.3"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
