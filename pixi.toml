[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
pytest = "*"
gevent = "*"
sqlalchemy = "*"
python-dateutil = "*"
tzlocal = ">=4.1,<5.0"
matplotlib = "*"
numpy = "*"
deepdiff = "*"
sortedcontainers = "*"

[pypi-dependencies]
tent = { path = ".", editable = true }

[tasks]
test = "pytest tests unit_tests -v"
test-integration = "pytest tests/integration -v"

